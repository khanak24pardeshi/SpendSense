{% extends "base.html" %}

{% block title %}Edit Transaction | SpendSense{% endblock %}

{% block content %}

<section class="add-transaction-page">

    <div class="add-transaction-container">

        <a
            href="{{ url_for('transactions') }}"
            class="back-dashboard-btn"
        >
            <i class="fa-solid fa-arrow-left"></i>
            Back to Transactions
        </a>

        <div class="add-transaction-header">

            <span class="dashboard-label">
                ✦ UPDATE MONEY ACTIVITY
            </span>

            <h1>Edit Transaction</h1>

            <p>
                Update the details of your income or expense.
            </p>

        </div>


        <div class="add-transaction-card">

            <form method="POST">

                <!-- TYPE -->

                <div class="form-group">

                    <label for="type">
                        Transaction Type
                    </label>

                    <select
                        id="type"
                        name="type"
                        required
                    >

                        <option
                            value="income"
                            {% if transaction["type"] == "income" %}selected{% endif %}
                        >
                            Income
                        </option>

                        <option
                            value="expense"
                            {% if transaction["type"] == "expense" %}selected{% endif %}
                        >
                            Expense
                        </option>

                    </select>

                </div>


                <!-- AMOUNT -->

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        value="{{ transaction['amount'] }}"
                        placeholder="Enter amount"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category_id">
                        Category
                    </label>

                    <select
                        id="category_id"
                        name="category_id"
                        required
                    >

                        {% for category in categories %}

                        <option
                            value="{{ category['id'] }}"
                            data-type="{{ category['type'] }}"
                            {% if category['id'] == transaction['category_id'] %}selected{% endif %}
                        >
                            {{ category['name'] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        value="{{ transaction['description'] or '' }}"
                        placeholder="e.g. Monthly salary"
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        value="{{ transaction['date'] }}"
                        required
                    >

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <a
                        href="{{ url_for('transactions') }}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="dashboard-add-btn"
                    >
                        <i class="fa-solid fa-check"></i>
                        Update Transaction
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
