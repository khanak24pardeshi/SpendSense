{% extends "base.html" %}

{% block title %}Add Transaction | SpendSense{% endblock %}

{% block content %}

<section class="transaction-page">

    <div class="transaction-container">

        <div class="transaction-header">

            <span class="dashboard-label">
                ✦ MONEY MANAGEMENT
            </span>

            <h1>Add Transaction</h1>

            <p>
                Record your income or expense to keep your finances updated.
            </p>

        </div>


        <div class="transaction-form-card">

            <form method="POST">


                <!-- TYPE -->

                <div class="form-group">

                    <label for="type">
                        Transaction Type
                    </label>

                    <select
                        id="type"
                        name="type"
                        required
                    >

                        <option value="">
                            Select transaction type
                        </option>

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                </div>


                <!-- AMOUNT -->

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category_id">
                        Category
                    </label>

                    <select
    id="category_id"
    name="category_id"
    required
>

    <option value="">
        Select category
    </option>

    {% for category in categories %}

    <option
        value="{{ category['id'] }}"
        data-type="{{ category['type'] }}"
    >
        {{ category['name'] }}
    </option>

    {% endfor %}

</select>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="Example: Monthly pocket money"
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <div class="transaction-actions">

                    <a
                        href="{{ url_for('dashboard') }}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="save-transaction-btn"
                    >
                        <i class="fa-solid fa-check"></i>
                        Save Transaction
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
